name: Clean all Actions artifacts

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete all stored Actions artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Delete every artifact in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts"
          ids_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "${ids_file}" "${response_file}"' EXIT

          request() {
            local method="$1"
            local url="$2"
            local attempt=1
            local status

            while (( attempt <= 10 )); do
              status="$(curl --silent --show-error -o "${response_file}" -w '%{http_code}' \
                -X "${method}" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${url}" || true)"

              if [[ "${status}" =~ ^2[0-9][0-9]$ ]]; then
                return 0
              fi

              # A prior DELETE may have succeeded even if GitHub returned a 502.
              if [[ "${method}" == "DELETE" && "${status}" == "404" ]]; then
                echo "Artifact already absent; continuing."
                return 0
              fi

              if [[ "${status}" == "429" || "${status}" =~ ^5[0-9][0-9]$ || -z "${status}" ]]; then
                echo "Temporary GitHub/API error (HTTP ${status:-network}); retry ${attempt}/10."
                sleep $(( attempt < 6 ? attempt * 2 : 12 ))
                attempt=$((attempt + 1))
                continue
              fi

              echo "Non-retryable HTTP ${status}:"
              cat "${response_file}"
              return 1
            done

            echo "Request failed after 10 attempts: ${method} ${url}"
            cat "${response_file}"
            return 1
          }

          page=1
          echo "Collecting artifact IDs..."
          while true; do
            request GET "${api}?per_page=100&page=${page}"
            count="$(jq '.artifacts | length' "${response_file}")"
            jq -r '.artifacts[].id' "${response_file}" >> "${ids_file}"

            echo "Collected ${count} artifacts from page ${page}."
            if (( count < 100 )); then
              break
            fi
            page=$((page + 1))
          done

          total="$(wc -l < "${ids_file}" | tr -d ' ')"
          echo "Found ${total} artifacts. Deleting them..."

          deleted=0
          while IFS= read -r artifact_id; do
            [ -n "${artifact_id}" ] || continue
            request DELETE "${api}/${artifact_id}"
            deleted=$((deleted + 1))
            if (( deleted % 50 == 0 )); then
              echo "Processed ${deleted}/${total} artifacts."
            fi
          done < "${ids_file}"

          echo "Cleanup complete. Processed ${deleted} artifacts."
