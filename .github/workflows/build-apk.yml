name: Build Production APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore MainActivity.kt
        run: |
          python3 scripts/restore_mainactivity.py
          wc -c app/src/main/java/com/example/MainActivity.kt
          head -5 app/src/main/java/com/example/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses & install SDK packages
        run: |
          set +e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            SDK="$HOME/Android/Sdk"
            echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
            export ANDROID_HOME="$SDK"
            export ANDROID_SDK_ROOT="$SDK"
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || \
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Generate signing keystore
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore distribution.keystore \
              -storepass wisdomtower \
              -alias upload \
              -keypass wisdomtower \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Wisdom Tower Academy,O=Wisdom Tower,C=ET"
            echo "KEYSTORE_PATH=$PWD/distribution.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=wisdomtower" >> $GITHUB_ENV
            echo "KEY_PASSWORD=wisdomtower" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper (9.3.1)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate brand launcher icons
        run: |
          python3 -m pip install pillow -q
          python3 scripts/generate_icons.py

      - name: Build Release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Always show build errors
        if: failure()
        run: |
          echo "======== BUILD LOG (last 250 lines) ========"
          tail -n 250 build.log || true
          grep -i -E "error:|e: |FAILED|What went wrong|Unresolved|Exception|Compilation" build.log | tail -n 100 || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package Wisdom-tower-academy.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK path: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found"
            find app/build -type f -name "*.apk" || true
            exit 1
          fi
          cp "$APK_PATH" ./Wisdom-tower-academy.apk
          ls -lh ./Wisdom-tower-academy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-tower-academy
          path: Wisdom-tower-academy.apk
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "### Production APK ready" >> $GITHUB_STEP_SUMMARY
          echo "Download **Wisdom-tower-academy.apk** from Artifacts." >> $GITHUB_STEP_SUMMARY
