name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || ls -la "$ANDROID_SDK_ROOT" || true

      - name: Accept licenses & install platform if needed
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            # Fallback common path on GitHub-hosted runners
            SDK="$HOME/Android/Sdk"
            echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
            export ANDROID_HOME="$SDK"
          fi
          echo "Using SDK at: $SDK"
          yes | sdkmanager --licenses || true
          # Install a stable platform/build-tools set
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.13 || gradle wrapper
            chmod +x ./gradlew
          else
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find and copy APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK path: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found"
            find app/build -type f -name "*.apk" || true
            ls -laR app/build/outputs || true
            exit 1
          fi
          cp "$APK_PATH" ./Wisdom-Tower-Academy-debug.apk
          ls -lh ./Wisdom-Tower-Academy-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-Tower-Academy-debug
          path: Wisdom-Tower-Academy-debug.apk
          retention-days: 14

      - name: Summary
        run: |
          echo "### APK ready" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact **Wisdom-Tower-Academy-debug** from this run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "On your phone:" >> $GITHUB_STEP_SUMMARY
          echo "1. Open this Actions run in Chrome" >> $GITHUB_STEP_SUMMARY
          echo "2. Tap Artifacts → Wisdom-Tower-Academy-debug" >> $GITHUB_STEP_SUMMARY
          echo "3. Download and install the APK" >> $GITHUB_STEP_SUMMARY
