name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses & install SDK packages
        run: |
          set +e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            SDK="$HOME/Android/Sdk"
            echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
            export ANDROID_HOME="$SDK"
            export ANDROID_SDK_ROOT="$SDK"
          fi
          echo "ANDROID_HOME=$SDK"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || \
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper (9.3.1)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate brand launcher icons
        run: |
          python3 -m pip install pillow -q
          python3 scripts/generate_icons.py

      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Always show build errors
        if: failure()
        run: |
          echo "======== BUILD LOG (last 250 lines) ========"
          tail -n 250 build.log || true
          echo "======== ERROR / FAILED LINES ========"
          grep -i -E "error:|e: |FAILED|What went wrong|Unresolved|Exception|Compilation" build.log | tail -n 100 || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Find and copy APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK path: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found"
            find app/build -type f -name "*.apk" || true
            ls -laR app/build/outputs || true
            exit 1
          fi
          cp "$APK_PATH" ./Wisdom-Tower-Academy-debug.apk
          ls -lh ./Wisdom-Tower-Academy-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-Tower-Academy-debug
          path: Wisdom-Tower-Academy-debug.apk
          retention-days: 14

      - name: Summary
        if: success()
        run: |
          echo "### APK ready" >> $GITHUB_STEP_SUMMARY
          echo "Download **Wisdom-Tower-Academy-debug** from Artifacts." >> $GITHUB_STEP_SUMMARY
