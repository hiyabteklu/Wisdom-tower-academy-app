name: Build Production AAB & APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Production Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore MainActivity.kt
        run: |
          python3 scripts/restore_mainactivity.py
          wc -c app/src/main/java/com/wisdomtower/academy/MainActivity.kt
          head -5 app/src/main/java/com/wisdomtower/academy/MainActivity.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Using google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Creating default google-services.json for build"
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "401468584514",
              "project_id": "wisdom-tower-academy",
              "storage_bucket": "wisdom-tower-academy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:401468584514:android:d83921048bcae1f2",
                  "android_client_info": {
                    "package_name": "com.wisdomtower.academy"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyWisdomTowerAcademyDefaultKeyForFCM00"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Accept licenses & install SDK packages
        run: |
          set +e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            SDK="$HOME/Android/Sdk"
            echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
            export ANDROID_HOME="$SDK"
            export ANDROID_SDK_ROOT="$SDK"
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || \
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Configure signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "Using production upload keystore from KEYSTORE_BASE64 secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.KEYSTORE_PATH }}" ] && [ -f "${{ secrets.KEYSTORE_PATH }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "Using production upload keystore from KEYSTORE_PATH secret"
            echo "KEYSTORE_PATH=${{ secrets.KEYSTORE_PATH }}" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
          else
            echo "::error::Missing required production signing secrets in GitHub Actions (KEYSTORE_BASE64 and STORE_PASSWORD)."
            echo "Google Play production builds require a genuine upload keystore. Please configure KEYSTORE_BASE64 and STORE_PASSWORD in repository secrets."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper (9.3.1)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate brand launcher icons
        run: |
          python3 -m pip install pillow -q
          python3 scripts/generate_icons.py

      - name: Build Release Bundle (AAB) and APK
        id: build
        env:
          CI: "true"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Always show build errors
        if: failure()
        run: |
          echo "======== BUILD LOG (last 250 lines) ========"
          tail -n 250 build.log || true
          grep -i -E "error:|e: |FAILED|What went wrong|Unresolved|Exception|Compilation" build.log | tail -n 100 || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package Wisdom-tower-academy.aab
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          echo "AAB path: $AAB_PATH"
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: No release AAB found"
            find app/build -type f -name "*.aab" || true
            exit 1
          fi
          cp "$AAB_PATH" ./Wisdom-tower-academy.aab
          ls -lh ./Wisdom-tower-academy.aab

      - name: Package Wisdom-tower-academy.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK path: $APK_PATH"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./Wisdom-tower-academy.apk
            ls -lh ./Wisdom-tower-academy.apk
          fi

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-tower-academy-AAB
          path: Wisdom-tower-academy.aab
          retention-days: 30

      - name: Upload Release APK artifact
        if: hashFiles('Wisdom-tower-academy.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-tower-academy-APK
          path: Wisdom-tower-academy.apk
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "### Production Play Store Build Ready" >> $GITHUB_STEP_SUMMARY
          echo "- **Wisdom-tower-academy.aab**: Upload this file directly to Google Play Console." >> $GITHUB_STEP_SUMMARY
          echo "- **Wisdom-tower-academy.apk**: Direct testing release APK." >> $GITHUB_STEP_SUMMARY
