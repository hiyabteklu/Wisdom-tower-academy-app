name: Build Telegram Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Telegram release APK only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore MainActivity.kt
        run: |
          python3 scripts/restore_mainactivity.py
          test -s app/src/main/java/com/wisdomtower/academy/MainActivity.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "401468584514",
              "project_id": "wisdom-tower-academy",
              "storage_bucket": "wisdom-tower-academy.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:401468584514:android:d83921048bcae1f2",
                "android_client_info": { "package_name": "com.wisdomtower.academy" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyWisdomTowerAcademyDefaultKeyForFCM00" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      # 2026-10-31: runner no longer has sdkmanager on PATH (exit 127).
      # This action installs the command-line tools, accepts licenses and installs the packages.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Configure production signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH_SECRET: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_PATH_SECRET" ] && [ -f "$KEYSTORE_PATH_SECRET" ] && [ -n "$STORE_PASSWORD_SECRET" ]; then
            echo "KEYSTORE_PATH=$KEYSTORE_PATH_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Missing production signing secrets (KEYSTORE_BASE64 or KEYSTORE_PATH, plus STORE_PASSWORD)."
            exit 1
          fi
          echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET:-$STORE_PASSWORD_SECRET}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-upload}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Generate launcher icons
        run: |
          python3 -m pip install pillow -q
          python3 scripts/generate_icons.py

      - name: Build Telegram release APK only
        env:
          CI: "true"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PpaidUi=true --stacktrace --no-daemon 2>&1 | tee build-telegram.log
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Telegram release APK was not generated."
            exit 1
          fi
          cp "$APK_PATH" Wisdom-tower-academy-telegram.apk
          ls -lh Wisdom-tower-academy-telegram.apk

      - name: Publish versioned APK GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\\1/')
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\\1/')
          TAG="telegram-v${VERSION_NAME}-${VERSION_CODE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Wisdom-tower-academy-telegram.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" Wisdom-tower-academy-telegram.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wisdom Tower Academy ${VERSION_NAME} (Telegram)" \
              --notes "Telegram release APK. versionCode: ${VERSION_CODE}. Built from commit ${GITHUB_SHA}." \
              --prerelease
          fi

      - name: Upload Telegram release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-tower-academy-TELEGRAM-APK
          path: Wisdom-tower-academy-telegram.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-build-log
          path: build-telegram.log
          retention-days: 7
          if-no-files-found: ignore
