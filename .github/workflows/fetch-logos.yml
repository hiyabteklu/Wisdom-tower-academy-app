name: Fetch university logos
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/fetch_logos.py
      - run: zip -r logos.zip logos sources.csv missing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: university-logos
          path: logos.zip
