<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Offline • Wisdom Tower Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.22);
      border-radius: 24px;
      padding: 32px 24px 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .icon-container {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: radial-gradient(circle at center, rgba(0, 229, 255, 0.16) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.18);
    }
    .icon-container svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: #00E5FF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .offline-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .offline-desc {
      font-size: 0.92rem;
      line-height: 1.45;
      color: #94A3B8;
      margin-bottom: 24px;
      max-width: 270px;
    }
    .btn-retry {
      width: 100%;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #00E5FF;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.3);
      transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.97);
      background: #38BDF8;
    }
    .btn-retry:disabled {
      opacity: 0.7;
    }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(15, 23, 42, 0.3);
      border-top-color: #0F172A;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .shake {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23" stroke="#00E5FF" stroke-width="2" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3" />
      </svg>
    </div>
    <h1 class="offline-title">You're offline</h1>
    <p class="offline-desc">Please connect to Wi-Fi or mobile data and try again.</p>
    
    <button id="retryBtn" class="btn-retry" type="button" onclick="doRetry()">
      <span class="spinner" id="retrySpinner"></span>
      <span id="retryLabel">Try again</span>
    </button>
  </div>

  <script>
    var isChecking = false;

    function doReload() {
      if (window.AndroidOfflineVault && typeof window.AndroidOfflineVault.reloadLastOnlinePage === 'function') {
        window.AndroidOfflineVault.reloadLastOnlinePage();
      } else {
        window.location.reload();
      }
    }

    function doRetry() {
      if (isChecking) return;
      isChecking = true;
      var btn = document.getElementById('retryBtn');
      var spinner = document.getElementById('retrySpinner');
      var label = document.getElementById('retryLabel');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      label.textContent = 'Checking…';

      doReload();

      setTimeout(function() {
        isChecking = false;
        btn.disabled = false;
        spinner.style.display = 'none';
        label.textContent = 'Try again';
        btn.classList.add('shake');
        setTimeout(function() { btn.classList.remove('shake'); }, 380);
      }, 700);
    }

    window.addEventListener('online', function() {
      doReload();
    });

    setInterval(function() {
      if (navigator.onLine && !isChecking) {
        doReload();
      }
    }, 1500);
  </script>
</body>
</html>
