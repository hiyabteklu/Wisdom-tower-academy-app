<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Offline • Wisdom Tower Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.22);
      border-radius: 24px;
      padding: 32px 24px 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .icon-container {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: radial-gradient(circle at center, rgba(0, 229, 255, 0.16) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.18);
    }
    .icon-container svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: #00E5FF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .offline-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .offline-desc {
      font-size: 0.92rem;
      line-height: 1.45;
      color: #94A3B8;
      margin-bottom: 24px;
      max-width: 270px;
    }
    .btn-retry {
      width: 100%;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #00E5FF;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.3);
      transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.97);
      background: #38BDF8;
    }
    .btn-retry:disabled {
      opacity: 0.7;
    }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(15, 23, 42, 0.3);
      border-top-color: #0F172A;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .shake {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </div>
    <h1 class="offline-title">You're offline</h1>
    <p class="offline-desc">You're offline. Please connect to Wi-Fi or mobile data and try again.</p>
    
    <button id="retryBtn" class="btn-retry" type="button" onclick="doRetry()">
      <svg id="retryIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
      </svg>
      <span class="spinner" id="retrySpinner"></span>
      <span id="retryLabel">Try again</span>
    </button>
  </div>

  <script>
    var isChecking = false;

    function doReload() {
      if (window.AndroidOfflineVault && typeof window.AndroidOfflineVault.reloadLastOnlinePage === 'function') {
        window.AndroidOfflineVault.reloadLastOnlinePage();
      } else {
        window.location.reload();
      }
    }

    function onRetryFailed() {
      isChecking = false;
      var btn = document.getElementById('retryBtn');
      var spinner = document.getElementById('retrySpinner');
      var icon = document.getElementById('retryIcon');
      var label = document.getElementById('retryLabel');
      if (btn) {
        btn.disabled = false;
        btn.classList.add('shake');
        setTimeout(function() { btn.classList.remove('shake'); }, 380);
      }
      if (spinner) spinner.style.display = 'none';
      if (icon) icon.style.display = 'inline-block';
      if (label) label.textContent = 'Try again';
    }

    function doRetry() {
      if (isChecking) return;
      isChecking = true;
      var btn = document.getElementById('retryBtn');
      var spinner = document.getElementById('retrySpinner');
      var icon = document.getElementById('retryIcon');
      var label = document.getElementById('retryLabel');

      btn.disabled = true;
      if (icon) icon.style.display = 'none';
      if (spinner) spinner.style.display = 'inline-block';
      if (label) label.textContent = 'Connecting…';

      doReload();

      setTimeout(function() {
        if (isChecking) {
          onRetryFailed();
        }
      }, 1200);
    }

    window.addEventListener('online', function() {
      doReload();
    });
  </script>
</body>
</html>
