<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>You're offline • Wisdom Tower Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      width: 100%;
      max-width: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.22);
      border-radius: 24px;
      padding: 32px 24px 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .icon-container {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background: radial-gradient(circle at center, rgba(0, 229, 255, 0.16) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.18);
    }
    .icon-container svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #00E5FF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .offline-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    .offline-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #94A3B8;
      margin-bottom: 26px;
      max-width: 280px;
    }
    .btn-retry {
      width: 100%;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #00E5FF;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.98rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.3);
      transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.97);
      background: #38BDF8;
    }
    .btn-retry:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(15, 23, 42, 0.3);
      border-top-color: #0F172A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #64748B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23" stroke="#EF4444" stroke-width="2.2" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3" />
      </svg>
    </div>
    <h1 class="offline-title">You're offline</h1>
    <p class="offline-desc">You're offline. Please connect to Wi-Fi or mobile data and try again.</p>
    
    <button id="retryBtn" class="btn-retry" type="button" onclick="doRetry()">
      <span class="spinner" id="retrySpinner"></span>
      <span id="retryLabel">Try again</span>
    </button>

    <div class="status-hint">
      <span class="status-dot" id="liveDot"></span>
      <span id="liveText">Waiting for connection…</span>
    </div>

    <div style="margin-top: 20px; width: 100%; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 16px;">
      <p style="font-size: 0.78rem; color: #94A3B8; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; text-align: center;">Saved Offline Sections</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button type="button" onclick="openOfflineSection('https://www.wisdom-tower-academy.live/')" style="padding: 10px 8px; font-size: 0.82rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(0,229,255,0.25); color: #F8FAFC; border-radius: 12px; font-weight: 600; cursor: pointer;">Home</button>
        <button type="button" onclick="openOfflineSection('https://www.wisdom-tower-academy.live/learning')" style="padding: 10px 8px; font-size: 0.82rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(0,229,255,0.25); color: #F8FAFC; border-radius: 12px; font-weight: 600; cursor: pointer;">Learning</button>
        <button type="button" onclick="openOfflineSection('https://www.wisdom-tower-academy.live/academy')" style="padding: 10px 8px; font-size: 0.82rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(0,229,255,0.25); color: #F8FAFC; border-radius: 12px; font-weight: 600; cursor: pointer;">Academy</button>
        <button type="button" onclick="openOfflineSection('https://www.wisdom-tower-academy.live/academy/success-stories')" style="padding: 10px 8px; font-size: 0.82rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(0,229,255,0.25); color: #F8FAFC; border-radius: 12px; font-weight: 600; cursor: pointer;">Resources</button>
      </div>
    </div>
  </div>

  <script>
    var isChecking = false;

    function openOfflineSection(url) {
      if (window.AndroidOfflineVault && typeof window.AndroidOfflineVault.openOfflineUrl === 'function') {
        window.AndroidOfflineVault.openOfflineUrl(url);
      } else {
        window.location.replace(url);
      }
    }

    function navigateBackOnline() {
      if (window.AndroidOfflineVault && typeof window.AndroidOfflineVault.reloadLastOnlinePage === 'function') {
        window.AndroidOfflineVault.reloadLastOnlinePage();
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.replace('https://www.wisdom-tower-academy.live/');
      }
    }

    function doRetry() {
      if (isChecking) return;
      isChecking = true;
      var btn = document.getElementById('retryBtn');
      var spinner = document.getElementById('retrySpinner');
      var label = document.getElementById('retryLabel');
      
      btn.disabled = true;
      spinner.style.display = 'inline-block';
      label.textContent = 'Checking connection…';

      function checkComplete(online) {
        if (online) {
          label.textContent = 'Connected! Reopening…';
          document.getElementById('liveDot').style.background = '#10B981';
          document.getElementById('liveText').textContent = 'Online';
          setTimeout(navigateBackOnline, 400);
        } else {
          setTimeout(function() {
            isChecking = false;
            btn.disabled = false;
            spinner.style.display = 'none';
            label.textContent = 'Try again';
          }, 600);
        }
      }

      if (navigator.onLine === false) {
        checkComplete(false);
        return;
      }

      // Quick fetch probe
      var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timeout = setTimeout(function() {
        if (controller) controller.abort();
        checkComplete(false);
      }, 2500);

      fetch('https://www.wisdom-tower-academy.live/api/health', {
        method: 'HEAD',
        cache: 'no-store',
        signal: controller ? controller.signal : undefined
      }).then(function(resp) {
        clearTimeout(timeout);
        checkComplete(true);
      }).catch(function() {
        clearTimeout(timeout);
        // Fallback check navigator
        checkComplete(navigator.onLine);
      });
    }

    window.addEventListener('online', function() {
      document.getElementById('liveDot').style.background = '#10B981';
      document.getElementById('liveText').textContent = 'Back online! Reopening…';
      setTimeout(navigateBackOnline, 500);
    });

    // Background auto-reconnect polling every 2.5s
    setInterval(function() {
      if (navigator.onLine && !isChecking) {
        document.getElementById('liveDot').style.background = '#10B981';
        document.getElementById('liveText').textContent = 'Connection restored';
        navigateBackOnline();
      }
    }, 2500);
  </script>
</body>
</html>
