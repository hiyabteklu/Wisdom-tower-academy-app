<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0F172A;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 320px; width: 100%; }
    .icon-wrap {
      width: 80px; height: 80px; margin: 0 auto 22px;
      border-radius: 22px;
      background: #1E293B;
      border: 1px solid rgba(0, 229, 255, 0.28);
      display: flex; align-items: center; justify-content: center;
    }
    .wifi-off {
      width: 40px; height: 32px; position: relative;
    }
    .wifi-off span {
      position: absolute; left: 50%;
      border: 2.5px solid #00E5FF;
      border-radius: 50%;
      border-bottom-color: transparent;
      border-left-color: transparent;
      transform: translateX(-50%) rotate(-45deg);
      opacity: 0.9;
    }
    .wifi-off span:nth-child(1) { width: 10px; height: 10px; bottom: 2px; }
    .wifi-off span:nth-child(2) { width: 22px; height: 22px; bottom: 0; opacity: 0.7; }
    .wifi-off span:nth-child(3) { width: 34px; height: 34px; bottom: -2px; opacity: 0.45; }
    .slash {
      position: absolute; left: 50%; top: 0; bottom: 0;
      width: 2.5px; background: #00E5FF;
      transform: translateX(-50%) rotate(35deg);
      border-radius: 2px;
    }
    h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 12px; color: #f8fafc; }
    p { font-size: 0.98rem; line-height: 1.55; color: #94a3b8; margin-bottom: 26px; }
    button {
      appearance: none; border: none;
      background: #00E5FF; color: #0f172a;
      font-weight: 700; font-size: 1rem;
      padding: 14px 28px; border-radius: 14px;
      width: 100%; cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap" aria-hidden="true">
      <div class="wifi-off">
        <span></span><span></span><span></span>
        <div class="slash"></div>
      </div>
    </div>
    <h1>Connection required</h1>
    <p>Please turn on your mobile data or connect to WiFi to continue.</p>
    <button type="button" onclick="tryAgain()">Try again</button>
  </div>
  <script>
    function tryAgain() {
      if (navigator.onLine) {
        window.location.href = 'https://wisdom-tower-academy.live/';
      } else {
        location.reload();
      }
    }
    window.addEventListener('online', function () {
      window.location.href = 'https://wisdom-tower-academy.live/';
    });
  </script>
</body>
</html>
