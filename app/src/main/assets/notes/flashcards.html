<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  :root { color-scheme: dark; }
  /* F1g (2026-10-12): NORMAL FLOW like notes/index.html and quiz.html. The F2 version used html/body height:100% +
   * overflow:hidden + a full-height flex column; on the owner's phone the deck stayed completely dark. The card now has
   * its own explicit height (56vh, at least 300px), so it can never collapse to nothing. */
  html, body { margin: 0; padding: 0; background: #0a101d; }
  body { color: #cbd5e1; font: 16px/1.6 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
  /* F1 (2026-11-02): a card sliding off the screen must never create a sideways page scroll, so #root clips sideways
   * (hidden first for old WebViews, then clip, which keeps the vertical overflow visible). */
  #root { box-sizing: border-box; padding: 6px 12px 16px; max-width: 640px; margin: 0 auto; overflow-wrap: anywhere; overflow-x: hidden; overflow-x: clip; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; font-size: .95rem; margin: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: .75rem; margin-bottom: 6px; }
  .chip { border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 3px 8px; color: #94a3b8; }
  .chip.know { border-color: rgba(52,211,153,.25); color: #a7f3d0; }
  .chip.learning { border-color: rgba(251,191,36,.25); color: #fde68a; }
  .chip.again { border-color: rgba(251,113,133,.25); color: #fecdd3; }

  /* F1 (docs/READER_EXAM_FLASHCARD_FIX_PLAN.md, 2026-11-02): TWO different motions, never mixed.
   *  - FLIP (tap) = the card turns around its vertical axis with perspective (.flip.turn, 0.4 s). Still NO preserve-3d and
   *    NO backface-visibility: only ONE face is shown at a time and the faces are swapped while the card is edge-on
   *    (script below), so a missing 3D transform can never hide the answer (the F1d lesson). The perspective is part of
   *    the transform itself (perspective(900px) rotateY()), so it works on this element without a 3D parent.
   *  - CHANGE CARD (swipe, Previous, Next, Again / Learning / Known) = the card (.mover) slides and tilts out and fades, the
   *    next card slides in from the other side with a slight tilt. The finger drags the card, and an early release springs
   *    it back. Two cards are visible behind it (.stk) as a deck.
   * This replaces the owner request of 2026-10-24 (no sideways move, same turn for everything): the owner's newer plan asks
   * for slide for changing cards and the 3D turn only for the flip. To go back to the 10-24 look, see
   * docs/SESSION_2026-11-02_F1_FLASHCARDS.md.
   *
   * SOLID CARDS (owner request 2026-11-04: "the card should not be transparent, subtle blue front, subtle green back"):
   * the app's glass script (AppBackdrop.kt GLASS_JS) turns every dark-navy element background of a page into see-through
   * glass, and that included the card faces. The colour is therefore NOT painted as the background of .face / .stk (the
   * script would find and replace it) but by a ::before layer behind them (the script only looks at real elements), so the
   * cards stay opaque: front = subtle blue, back = subtle green (.flip.flipped switches it while the card is edge-on).
   * By day (html.wt-day, added by the day script) the same two hues are pale tints, because the day script turns the text
   * on these faces into dark ink. To go back to the old see-through navy: put the old gradient back on .face / .stk
   * (front and back were the same navy gradient, 131f38 / 0e172a / 0a101d). */
  .slot { position: relative; height: 56vh; min-height: 300px; margin-bottom: 26px; cursor: pointer; }
  .stk { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 22px; border: 1px solid rgba(96,165,250,.28);
         background: transparent; isolation: isolate; transform-origin: 50% 100%; box-shadow: 0 8px 18px rgba(0,0,0,.3); }
  .stk::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 21px; z-index: -1;
                 background: linear-gradient(160deg, #162f58, #11264a 60%, #0d1e3a); }
  .stk.s1 { transform: translateY(11px) scale(.955); opacity: .75; }
  .stk.s2 { transform: translateY(22px) scale(.91); opacity: .45; }
  .mover { position: absolute; top: 0; left: 0; right: 0; bottom: 0; will-change: transform; }
  .mover.in-fwd { animation: fcInFwd .3s cubic-bezier(.22,1,.36,1); }
  .mover.in-back { animation: fcInBack .3s cubic-bezier(.22,1,.36,1); }
  .mover.in-fade { animation: fcFade .18s ease-out; }
  .flip { position: absolute; top: 0; left: 0; right: 0; bottom: 0; isolation: isolate; }
  .flip::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 22px; z-index: -1;
                  background: linear-gradient(160deg, #1b3b6e, #153059 60%, #102545); }
  .flip.flipped::before { background: linear-gradient(160deg, #18493a, #133b2f 60%, #0e2c23); }
  .flip.turn { animation: fcTurn .4s linear; }
  .flip.turn .face { animation: fcShadow .4s ease-in-out; }
  .face { position: absolute; top: 0; left: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 22px; padding: 18px 20px;
          border: 1px solid rgba(96,165,250,.42); background: transparent;
          box-shadow: 0 12px 26px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow-y: auto; }
  .face.back { display: none; border-color: rgba(52,211,153,.45); }
  .flip.flipped .face.front { display: none; }
  .flip.flipped .face.back { display: flex; }
  /* day: pale blue front, pale green back (the day script makes the text deep ink); more specific rules come last */
  html.wt-day .stk::before { background: #e4eefb; }
  html.wt-day .flip::before { background: linear-gradient(160deg, #e8f1fc, #dbe8f8); }
  html.wt-day .flip.flipped::before { background: linear-gradient(160deg, #e4f4ea, #d6ecde); }
  @keyframes fcIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fcInFwd { from { opacity: 0; transform: translateX(52px) rotate(4deg); } to { opacity: 1; transform: none; } }
  @keyframes fcInBack { from { opacity: 0; transform: translateX(-52px) rotate(-4deg); } to { opacity: 1; transform: none; } }
  @keyframes fcFade { from { opacity: 0; } to { opacity: 1; } }
  /* first half speeds up to edge-on, second half slows down; the faces are swapped at the 50 percent mark */
  @keyframes fcTurn {
    0% { transform: perspective(900px) rotateY(0deg); animation-timing-function: ease-in; }
    49.9% { transform: perspective(900px) rotateY(90deg); }
    50% { transform: perspective(900px) rotateY(-90deg); animation-timing-function: ease-out; }
    100% { transform: perspective(900px) rotateY(0deg); }
  }
  /* the shadow shrinks while the card is edge-on and comes back */
  @keyframes fcShadow { 0%, 100% { box-shadow: 0 12px 26px rgba(0,0,0,.4); } 50% { box-shadow: 0 2px 6px rgba(0,0,0,.2); } }

  .lbl { flex: 0 0 auto; margin: 0 0 8px; text-align: center; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
  .lbl.q { color: #93c5fd; }
  .lbl.a { color: #6ee7b7; }
  /* text sits in the middle of the card; auto margins collapse when the text is longer than the card, so it scrolls */
  .mid { margin: auto 0; text-align: center; }
  .fc-text { color: #fff; font-family: var(--wt-content-font-family, "WT Tinos", serif); font-weight: 700; font-style: var(--wt-content-font-style, italic); font-size: var(--wt-content-size-flashcard, 20px); line-height: var(--wt-content-line-flashcard, 28px); }
  .fc-text.s1, .fc-text.s2, .fc-text.s3 { font-size: var(--wt-content-size-flashcard, 20px); line-height: var(--wt-content-line-flashcard, 28px); }
  .fc-text .study-p { margin: .5em 0; }
  .fc-text .study-list { display: inline-block; text-align: left; }
  .hint { text-align: center; font-size: .75rem; color: #94a3b8; margin: 10px 0 0; }

  .bar { padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .nav, .rate { display: flex; gap: 8px; }
  .nav .btn, .rate .btn { flex: 1 1 0; }
  .btn { font: 600 .95rem/1 -apple-system, Roboto, sans-serif; padding: 14px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: #e2e8f0; transition: transform .14s ease-out, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .35; }
  .btn.again { border-color: rgba(251,113,133,.45); color: #fecdd3; }
  .btn.learning { border-color: rgba(251,191,36,.45); color: #fde68a; }
  .btn.know { background: #10b981; border-color: #10b981; color: #0a101d; font-weight: 800; }
  .btn.violet { background: #8b5cf6; border-color: #8b5cf6; color: #fff; font-weight: 800; padding: 14px 22px; }
  .done { margin: 24px 0; border: 1px solid rgba(255,255,255,.12); background: #0e172a; border-radius: 20px; padding: 28px 24px; text-align: center; animation: fcIn .32s cubic-bezier(.22,1,.36,1); }
  .done .big { margin: 0 0 6px; font-size: 1.4rem; font-weight: 800; color: #fff; }
  .done .sub { margin: 0 0 18px; font-size: .95rem; color: #94a3b8; }

  /* Remove animations in the phone settings: no turn, no slide, no drag; a changed card only fades in (.in-fade) */
  @media (prefers-reduced-motion: reduce) {
    .done, .flip.turn, .flip.turn .face, .mover.in-fwd, .mover.in-back { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"><p class="msg">Loading deck...</p></div>
<script>
/* A script error must never leave a silent dark screen: show the message on the page (the owner can read it) */
window.onerror = function (message) {
  var r = document.getElementById("root");
  if (r) r.innerHTML = '<p class="msg">Could not display this deck. (' + String(message).slice(0, 160) + ")</p>";
};
</script>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/*
 * Flashcard deck viewer (plan step N3, redesigned in F2, owner report 2026-10-12 problem 7).
 * Port of the website's components/learning/FlashcardViewer.tsx: "Question / Answer · tap to flip", counters,
 * previous / next, swipe left/right, "Deck complete" with "Practice again", empty text "No cards in this deck yet.".
 * F2: text centered in the card with a size that follows its length, a "Previous" / "Next" row and a rating row
 * "Again" / "Learning" / "Known" (the owner's wording; the website says "Know"). The stats keys sent to the app
 * are unchanged (know, learning, again, seen, total, accuracy).
 * F1c: visible errors instead of a silent dark screen. F1d: no preserve-3d / backface. F1g: normal page flow, fixed card height.
 * Owner request 2026-10-24 (replaced on 2026-11-02, see the style block): the card did not follow the finger and every change
 * used the flip's turn.
 * F1 (2026-11-02, docs/READER_EXAM_FLASHCARD_FIX_PLAN.md, problem 2): two separate motions.
 *   Tap = 3D flip (turn around the vertical axis, 0.4 s, faces swapped at edge-on).
 *   Swipe / Previous / Next / Again / Learning / Known = ONE slide animation: the card slides out sideways with a tilt and
 *   fades (0.22 s), the next card slides in from the other side (0.3 s). Swipe: the card follows the finger (with a slight
 *   tilt); released at 60 px or more it slides out, released earlier it springs back. At the first / last card the drag has
 *   resistance and always springs back. No flip while a swipe or a card change is running. Two cards are drawn behind the
 *   top card while more cards follow. With "Remove animations" on, nothing moves: the card changes at once with a short fade.
 * Called from the app: window.setDeck(metaJsonText) with the row's `meta` JSON ({ "cards": [ { front, back } ] }).
 * Progress goes back to the app through window.WTBridge.onProgress(json) (the app saves it to learning_progress).
 */
(function () {
  var root = document.getElementById("root");
  var cards = [], i = 0, flipped = false, grades = {}, done = false;
  var startX = null, startY = null, dx = 0, swiping = false, busy = false, suppressClick = false;
  var reduced = false;
  try { reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

  function R(t) {
    try { return window.WTRich.render(String(t == null ? "" : t)); } catch (e) { return ""; }
  }

  /* text size class by length: short = big, long = smaller, so the text always sits balanced in the card */
  function sz(t) {
    var n = String(t == null ? "" : t).length;
    return n > 260 ? " s3" : (n > 120 ? " s2" : " s1");
  }

  function face(cls, label, lc, text) {
    return '<div class="face ' + cls + '"><p class="lbl ' + lc + '">' + label + " · tap to flip</p>" +
      '<div class="mid"><div class="fc-text' + sz(text) + '">' + R(text) + "</div></div></div>";
  }

  function stats() {
    var know = 0, learning = 0, again = 0, seen = 0, k;
    for (k in grades) {
      if (!Object.prototype.hasOwnProperty.call(grades, k)) continue;
      seen++;
      if (grades[k] === "know") know++;
      else if (grades[k] === "learning") learning++;
      else again++;
    }
    return { know: know, learning: learning, again: again, seen: seen, total: cards.length, accuracy: seen ? Math.round((know / seen) * 100) : 0 };
  }

  function report() {
    if (window.WTBridge && window.WTBridge.onProgress) {
      try { window.WTBridge.onProgress(JSON.stringify(stats())); } catch (e) {}
    }
  }

  /* enter: "fwd" (the new card slides in from the right), "back" (from the left), "fade" (reduced motion) or "" (drawn at once) */
  function draw(enter) {
    if (!cards.length) { root.innerHTML = '<p class="msg">No cards in this deck yet.</p>'; return; }
    var s = stats();
    if (done) {
      root.innerHTML = '<div class="done"><p class="big">Deck complete</p><p class="sub">Known ' + s.know + " · Learning " + s.learning +
        " · Again " + s.again + '</p><button class="btn violet" data-act="restart">Practice again</button></div>';
      return;
    }
    var c = cards[i];
    var stack = (i + 2 < cards.length ? '<div class="stk s2"></div>' : "") + (i + 1 < cards.length ? '<div class="stk s1"></div>' : "");
    root.innerHTML =
      '<div class="chips"><span class="chip">' + (i + 1) + "/" + cards.length + '</span><span class="chip know">Known ' + s.know +
      '</span><span class="chip learning">Learning ' + s.learning + '</span><span class="chip again">Again ' + s.again + "</span></div>" +
      '<div class="slot" data-act="flip">' + stack + '<div class="mover' + (enter ? " in-" + enter : "") + '" id="mover">' +
      '<div class="flip' + (flipped ? " flipped" : "") + '" id="flip">' +
      face("front", "Question", "q", c.front) + face("back", "Answer", "a", c.back) + "</div></div></div>" +
      '<p class="hint">Swipe left/right to change card · Tap to flip</p>' +
      '<div class="bar"><div class="nav"><button class="btn" data-act="prev"' + (i === 0 ? " disabled" : "") + '>‹ Previous</button>' +
      '<button class="btn" data-act="next"' + (i >= cards.length - 1 ? " disabled" : "") + '>Next ›</button></div>' +
      '<div class="rate"><button class="btn again" data-act="again">Again</button><button class="btn learning" data-act="learning">Learning</button>' +
      '<button class="btn know" data-act="know">Known</button></div></div>';
  }

  /* which way the NEW card comes in: leaving to the left (dir -1) means the next card comes from the right */
  function enterMode(dir) { return reduced ? "fade" : (dir < 0 ? "fwd" : "back"); }

  /* Card change: the old card slides out to the side with a tilt and fades (0.22 s, from wherever the finger left it), then
   * apply(mode) swaps the content and the new card slides in. dir -1 = out to the left (next card), 1 = out to the right
   * (previous card). Clicks and swipes are ignored while this runs (busy). With reduced motion the change is immediate. */
  function swapCard(dir, apply) {
    if (busy) return;
    var m = document.getElementById("mover");
    if (!m || reduced) { apply(enterMode(dir)); return; }
    busy = true;
    var w = Math.max(window.innerWidth || 360, 320);
    m.style.transition = "transform .22s ease-in, opacity .22s ease-in";
    m.style.transform = "translateX(" + (dir * w) + "px) rotate(" + (dir * 14) + "deg)";
    m.style.opacity = "0";
    window.setTimeout(function () { busy = false; apply(enterMode(dir)); }, 230);
  }

  function goTo(n) {
    if (n < 0 || n >= cards.length || n === i) return;
    swapCard(n > i ? -1 : 1, function (mode) { i = n; flipped = false; draw(mode); });
  }

  function grade(g) {
    if (busy) return;
    grades[i] = g;
    report();
    if (i < cards.length - 1) {
      swapCard(-1, function (mode) { i = i + 1; flipped = false; draw(mode); });
    } else {
      done = true; draw("");
    }
  }

  function restart() {
    grades = {}; done = false; i = 0; flipped = false; draw(""); report();
  }

  /* Flip: the card turns around its vertical axis (CSS animation "fcTurn", 0.4 s) and the faces are swapped while it is
   * edge-on (0.2 s). The swap happens even if the animation never runs, so the answer always appears. Not while a swipe or
   * a card change is running. With reduced motion the faces swap at once. */
  function flipCard() {
    if (busy || swiping) return;
    var f = document.getElementById("flip");
    if (!f) return;
    flipped = !flipped;
    if (reduced) {
      if (flipped) f.classList.add("flipped"); else f.classList.remove("flipped");
      return;
    }
    f.classList.remove("turn");
    void f.offsetWidth;
    f.classList.add("turn");
    window.setTimeout(function () {
      var g = document.getElementById("flip");
      if (!g) return;
      if (flipped) g.classList.add("flipped"); else g.classList.remove("flipped");
    }, 200);
  }

  root.addEventListener("click", function (e) {
    if (suppressClick || busy) return;
    var el = e.target;
    while (el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
    if (!el || el === root) return;
    var act = el.getAttribute("data-act");
    if (act === "flip") flipCard();
    else if (act === "prev") goTo(i - 1);
    else if (act === "next") goTo(i + 1);
    else if (act === "again" || act === "learning" || act === "know") grade(act);
    else if (act === "restart") restart();
  });

  /* Swipe: the card follows the finger (sideways, with a slight tilt). A horizontal swipe of 60 px or more changes the card with
   * the slide animation; an earlier release springs back. Where there is no card in that direction the drag has resistance and
   * always springs back. A vertical move is left to the page and the card scroll. */
  function canGo(d) { return d < 0 ? i < cards.length - 1 : i > 0; }

  document.addEventListener("touchstart", function (e) {
    if (busy || done) { startX = null; return; }
    var t = e.touches[0];
    startX = t.clientX; startY = t.clientY; dx = 0; swiping = false;
  }, { passive: true });

  document.addEventListener("touchmove", function (e) {
    if (startX == null) return;
    var t = e.touches[0], mx = t.clientX - startX, my = t.clientY - startY;
    if (!swiping) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      if (Math.abs(mx) < Math.abs(my) * 1.2) { startX = null; return; }
      swiping = true;
    }
    dx = mx;
    if (!reduced) {
      var m = document.getElementById("mover");
      if (m) {
        var eff = canGo(mx) ? mx : mx * 0.25;
        m.style.transition = "none";
        m.style.transform = "translateX(" + eff + "px) rotate(" + (eff / 24) + "deg)";
      }
    }
  }, { passive: true });

  function endSwipe(cancelled) {
    var was = swiping, d = dx;
    startX = null; startY = null; swiping = false; dx = 0;
    if (!was) return;
    suppressClick = true;
    window.setTimeout(function () { suppressClick = false; }, 350);
    if (cancelled || Math.abs(d) < 60 || !canGo(d)) {
      var m = document.getElementById("mover");
      if (m && !reduced) {
        m.style.transition = "transform .32s cubic-bezier(.34,1.56,.64,1)";
        m.style.transform = "translateX(0px) rotate(0deg)";
      }
      return;
    }
    goTo(i + (d < 0 ? 1 : -1));
  }
  document.addEventListener("touchend", function () { endSwipe(false); }, { passive: true });
  document.addEventListener("touchcancel", function () { endSwipe(true); }, { passive: true });

  window.setDeck = function (metaText) {
    try {
      var meta = JSON.parse(metaText || "{}");
      var list = Array.isArray(meta && meta.cards) ? meta.cards : [];
      cards = list.map(function (c) { return { front: c && c.front, back: c && c.back }; });
      i = 0; flipped = false; grades = {}; done = false; busy = false;
      draw("");
      if (cards.length) report();
    } catch (e) {
      root.innerHTML = '<p class="msg">Could not display this deck. (' + String(e && e.message || e).slice(0, 160) + ")</p>";
    }
  };
})();
</script>
</body>
</html>
