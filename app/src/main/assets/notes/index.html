<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  /* NOTE-SIZE (2026-10-17, owner: notes text is a bit small): note text 17px -> 20px, line 26px -> 32px. The root size is
     raised too (16px -> 19px) so headings, tables, code and the Summary box (all in rem) grow with it. Only this page
     changes; questions, exams and flashcards keep their own sizes. To go back: remove the html rule, 17px / 26px. */
  :root { color-scheme: dark; }
  html { font-size: 19px; }
  /* BG-NOFLASH (2026-10-23): the page paints NO background of its own (it was #0a101d). The app draws the chosen
     background behind this see-through page; a page that painted navy showed a dark flash whenever it was shown
     before the app's transparent override had run. To go back: background: #0a101d on this rule. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { color: #cbd5e1; font: 16px/1.7 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  #root { padding: 6px 14px 48px; max-width: 760px; margin: 0 auto; overflow-wrap: anywhere; opacity: 0; }
  #root.ready { opacity: 1; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; }

  #note { font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: 20px; line-height: 32px; }

  /* Summary (AI), plan step N10: same look as the website's NotesViewer */
  #sumwrap { margin-top: 24px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.08); }
  /* T1: the Summary and the Ask AI tutor buttons sit side by side (and wrap on a narrow screen) */
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .sumbtn { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.06); color: #e2e8f0; font: 600 .75rem/1 -apple-system, Roboto, sans-serif; padding: 9px 16px; border-radius: 999px; font-style: normal; }
  .sumbtn:disabled { opacity: .5; }
  .sumbtn.tutorbtn { border-color: rgba(34,211,238,.35); background: rgba(34,211,238,.12); color: #a5f3fc; }
  .sumbox { margin-top: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); border-radius: 16px; padding: 14px 16px; color: rgba(255,255,255,.9); font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: 20px; line-height: 32px; }
  .sumbox .lbl { margin: 0 0 8px; font: 600 .62rem/1 -apple-system, Roboto, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; font-style: normal; }
</style>
</head>
<body>
<div id="root"><div id="note"></div><div id="sumwrap"></div></div>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/* Short-notes page (plan step N6). The renderer lives in richtext.js (shared with flashcards).
 * Called from the app: window.setNote(text, startFrac).
 * "Summary" (plan step N10): the page cannot reach the network, so it asks the app through
 * WTBridge.onSummarize({ id, text }) and the app answers with window.wtSummaryResult(id, text).
 * "Ask AI tutor" (T1, docs/READER_EXAM_FLASHCARD_FIX_PLAN.md): next to the Summary button. It sends the note text to the app
 * with WTBridge.onTutor({ text }) (the first 14000 characters, about 2 pages of notes more than the Summary uses); the app
 * opens the AI tutor with that text as its chapter context. Nothing comes back to the page.
 * Reading progress (plan step N10, as the website's NotesViewer): the scrolled share of the page is reported
 * through WTBridge.onProgress({ pct }) (0 to 100, at most about every 2 seconds, 100 at once from 95 percent on
 * and after a successful Summary); the app saves it to learning_progress.
 * N1 (docs/READER_EXAM_FLASHCARD_FIX_PLAN.md): the note remembers where the student stopped, like the PDF reader.
 * The app passes the saved position as startFrac (0 to 1, share of the scrollable height; a share, not pixels, so it
 * still fits when the text size or the screen width is different). When the page is laid out (fonts ready) it scrolls
 * there, once more after 400 ms if the student has not touched the screen yet (maths and fonts can still change the
 * height), and then reports every position through WTBridge.onPosition({ frac }) (trailing, every 300 ms at most).
 * Nothing is reported before the restore, so the first screen (top) never overwrites the saved position. No saved
 * position (0), a position at the very start or a note that was read to the end (98 percent or more) opens at the top. */
var noteText = "", summary = "", loading = false, pendingId = "", seq = 0;
var lastPct = -1, pendingPct = -1, progTimer = 0, sent100 = false;
var posTimer = 0, canSavePos = false, userTouched = false;

/* the AI writes math as \( ... \) and \[ ... \]; the shared renderer reads $ ... $ and $$ ... $$ */
function aiText(s) {
  return String(s == null ? "" : s)
    .replace(/\\\[([\s\S]+?)\\\]/g, function (m, a) { return "$$" + a + "$$"; })
    .replace(/\\\(([\s\S]+?)\\\)/g, function (m, a) { return "$" + a + "$"; });
}

function sendProgress(pct) {
  if (!(window.WTBridge && window.WTBridge.onProgress)) return;
  if (pct === lastPct) return;
  lastPct = pct;
  try { window.WTBridge.onProgress(JSON.stringify({ pct: pct })); } catch (e) { /* ignore */ }
}

function flushProgress() {
  progTimer = 0;
  if (pendingPct >= 0) sendProgress(pendingPct);
}

function reportScroll() {
  if (!noteText) return;
  var h = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  var y = window.scrollY || document.documentElement.scrollTop || 0;
  var pct = Math.min(100, Math.round((y / h) * 100));
  pendingPct = pct;
  if (pct >= 95 && !sent100) {
    sent100 = true;
    pendingPct = 100;
    sendProgress(100);
    return;
  }
  if (!progTimer) progTimer = window.setTimeout(flushProgress, 2000);
}

/* N1: report the reading position (a share of the scrollable height) so the app can keep it on the phone */
function sendPos() {
  posTimer = 0;
  if (!canSavePos || !noteText) return;
  var h = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  var y = window.scrollY || document.documentElement.scrollTop || 0;
  var frac = Math.max(0, Math.min(1, y / h));
  if (window.WTBridge && window.WTBridge.onPosition) {
    try { window.WTBridge.onPosition(JSON.stringify({ frac: frac })); } catch (e) { /* ignore */ }
  }
}

function schedulePos() {
  if (!canSavePos || posTimer) return;
  posTimer = window.setTimeout(sendPos, 300);
}

window.addEventListener("scroll", reportScroll, { passive: true });
window.addEventListener("scroll", schedulePos, { passive: true });
window.addEventListener("resize", reportScroll, { passive: true });
window.addEventListener("touchstart", function () { userTouched = true; }, { passive: true });

function drawSummary() {
  var w = document.getElementById("sumwrap");
  if (!noteText) { w.innerHTML = ""; return; }
  var h = '<div class="btnrow"><button class="sumbtn" id="sumbtn"' + (loading ? " disabled" : "") + ">" + (loading ? "Summarizing\u2026" : "Summary") + "</button>" +
    '<button class="sumbtn tutorbtn" id="tutorbtn">Ask AI tutor</button></div>';
  if (summary) {
    var body;
    try { body = window.WTRich.render(aiText(summary)); } catch (e) { body = ""; }
    h += '<div class="sumbox"><p class="lbl">Summary</p>' + body + "</div>";
  }
  w.innerHTML = h;
}

window.setNote = function (text, startFrac) {
  var note = document.getElementById("note");
  var root = document.getElementById("root");
  var startF = Number(startFrac);
  var restore = isFinite(startF) && startF > 0.01 && startF < 0.98;
  if (root) root.classList.remove("ready");
  noteText = String(text == null ? "" : text);
  summary = ""; loading = false; pendingId = "";
  lastPct = -1; pendingPct = -1; sent100 = false;
  canSavePos = false; userTouched = false;
  if (progTimer) { window.clearTimeout(progTimer); progTimer = 0; }
  if (posTimer) { window.clearTimeout(posTimer); posTimer = 0; }
  try {
    note.innerHTML = window.WTRich.render(text);
  } catch (e) {
    note.innerHTML = '<p class="msg">Could not display this note.</p>';
  }
  drawSummary();
  window.scrollTo(0, 0);

  function applyPos() {
    var h = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if (h > 0) window.scrollTo(0, Math.round(startF * h));
  }

  function notifyReady() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        try { if (restore) applyPos(); } catch (e) { /* a bad position must never break the note */ }
        if (root) root.classList.add("ready");
        if (window.WTBridge && window.WTBridge.onReady) {
          try { window.WTBridge.onReady(); } catch (e) { /* ignore */ }
        }
        canSavePos = true;
        if (restore) {
          window.setTimeout(function () {
            if (!userTouched) { try { applyPos(); } catch (e) { /* ignore */ } }
          }, 400);
        }
      });
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(notifyReady).catch(notifyReady);
  } else {
    notifyReady();
  }
};

window.wtSummaryResult = function (id, text) {
  if (id !== pendingId) return;
  pendingId = ""; loading = false; summary = text;
  drawSummary();
  /* like the website: a finished summary counts as read, unless the AI could not be reached */
  if (text !== "Could not reach AI. Try again later.") {
    sent100 = true;
    pendingPct = 100;
    sendProgress(100);
  }
};

document.getElementById("sumwrap").addEventListener("click", function (e) {
  var t = e.target;
  if (!t) return;
  /* T1: Ask AI tutor. The app opens the tutor with this chapter; nothing to wait for here. */
  if (t.id === "tutorbtn") {
    if (window.WTBridge && window.WTBridge.onTutor) {
      try { window.WTBridge.onTutor(JSON.stringify({ text: noteText.slice(0, 14000) })); } catch (err) { /* ignore */ }
    }
    return;
  }
  if (t.id !== "sumbtn" || loading) return;
  loading = true; summary = ""; pendingId = "s" + (++seq);
  drawSummary();
  if (!(window.WTBridge && window.WTBridge.onSummarize)) {
    window.wtSummaryResult(pendingId, "Could not reach AI. Try again later.");
    return;
  }
  window.WTBridge.onSummarize(JSON.stringify({ id: pendingId, text: noteText.slice(0, 8000) }));
});
</script>
</body>
</html>
