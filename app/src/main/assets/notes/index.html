<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  /* NOTE-SIZE (2026-10-17, owner: notes text is a bit small): note text 17px -> 20px, line 26px -> 32px. The root size is
     raised too (16px -> 19px) so headings, tables, code and the Summary box (all in rem) grow with it. Only this page
     changes; questions, exams and flashcards keep their own sizes. To go back: remove the html rule, 17px / 26px. */
  :root { color-scheme: dark; }
  html { font-size: 19px; }
  /* BG-NOFLASH (2026-10-23): the page paints NO background of its own (it was #0a101d). The app draws the chosen
     background behind this see-through page; a page that painted navy showed a dark flash whenever it was shown
     before the app's transparent override had run. To go back: background: #0a101d on this rule. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { color: #cbd5e1; font: 16px/1.7 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  #root { padding: 6px 14px 48px; max-width: 760px; margin: 0 auto; overflow-wrap: anywhere; opacity: 0; }
  #root.ready { opacity: 1; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; }

  #note { font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: 20px; line-height: 32px; }

  /* Full-width tutor at the end of every note. */
  #tutorwrap { margin: 28px 0 20px; width: 100%; }
  .tutorbox { width: 100%; box-sizing: border-box; border: 1px solid rgba(34,211,238,.32); background: linear-gradient(155deg, rgba(22,42,48,.88), rgba(19,31,39,.82)); border-radius: 22px; padding: 18px 16px 16px; box-shadow: 0 12px 32px rgba(0,0,0,.16); }
  .tutorhead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .tutorbrand { font: 800 .72rem/1.3 -apple-system, Roboto, sans-serif; letter-spacing:.12em; color:#F2C66D; }
  .clearbtn { border:1px solid rgba(242,198,109,.42); background:rgba(242,198,109,.09); color:#F2C66D; font:600 .7rem/1 -apple-system, Roboto,sans-serif; padding:9px 12px; border-radius:999px; }
  .welcome { margin:0 0 14px; padding:14px; border-radius:16px; background:rgba(242,198,109,.09); border:1px solid rgba(242,198,109,.22); color:#F6D98F; font:700 16px/1.55 -apple-system,Roboto,sans-serif; }
  .welcome small { display:block; margin-top:7px; color:#D5C49B; font:400 13px/1.5 -apple-system,Roboto,sans-serif; }
  .tutorbox .lbl { margin: 0 0 4px; font: 700 .62rem/1 -apple-system, Roboto, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; font-style: normal; }
  .thint { margin: 6px 0 4px; font: 14px/1.5 -apple-system, Roboto, sans-serif; font-style: normal; color: #94a3b8; }
  .tb { margin: 10px 0; padding: 12px 14px; border-radius: 16px; overflow-wrap: anywhere; }
  .tb.user { margin-left: 12%; background: rgba(34,211,238,.14); border: 1px solid rgba(34,211,238,.3); color: #e2e8f0; font: 16px/1.5 -apple-system, Roboto, sans-serif; font-style: normal; white-space: pre-wrap; }
  .tb.bot { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.055); color: rgba(255,255,255,.94); font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: 19px; line-height: 1.65; }
  .tb.bot.think { color: #94a3b8; font: 15px/1.5 -apple-system, Roboto, sans-serif; font-style: normal; }
  .chips { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 14px 0 8px; }
  .chip { width:100%; box-sizing:border-box; border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.075); color: #A5F3FC; font: 600 14px/1.35 -apple-system, Roboto, sans-serif; font-style: normal; padding: 12px 14px; border-radius: 14px; text-align: left; }
  .chip.continue { border-color:rgba(242,198,109,.42); background:rgba(242,198,109,.08); color:#F2D28A; }
  .sumbtn { border:1px solid rgba(34,211,238,.38); background:rgba(34,211,238,.16); color:#A5F3FC; font:700 14px/1 -apple-system,Roboto,sans-serif; border-radius:999px; }
  .sumbtn:disabled { opacity:.55; }
  .tform { display: flex; gap: 8px; align-items: flex-end; margin-top: 14px; }
  #tinput { flex: 1; min-width: 0; resize: none; max-height: 140px; box-sizing: border-box; background: rgba(255,255,255,.07); border: 1px solid rgba(34,211,238,.3); border-radius: 18px; color: #e2e8f0; padding: 12px 14px; font: 16px/1.4 -apple-system, Roboto, sans-serif; font-style: normal; outline: none; }
  #tinput:focus { border-color: rgba(34,211,238,.7); }
  #tsend { flex: none; padding: 13px 18px; min-width:76px; }
  .clearconfirm { display:none; margin:10px 0; padding:12px; border-radius:14px; background:rgba(127,29,29,.2); border:1px solid rgba(248,113,113,.3); color:#fecaca; font:13px/1.4 -apple-system,Roboto,sans-serif; }
  .clearconfirm button { margin:8px 8px 0 0; border-radius:999px; padding:8px 12px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.07); color:#fff; }

  /* Inline AI tutor (2026-11-03, owner: the tutor continues BELOW the note instead of opening an overlay). The box has no
     height of its own and no inner scroll: it grows with every question and the whole page scrolls, like the note. */
  #tutorwrap { margin-top: 14px; }
  .tutorbox { border: 1px solid rgba(34,211,238,.25); background: rgba(255,255,255,.03); border-radius: 16px; padding: 12px 12px 14px; }
  .tutorbox .lbl { margin: 0 0 4px; font: 600 .62rem/1 -apple-system, Roboto, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; font-style: normal; }
  .thint { margin: 6px 0 4px; font: 14px/1.5 -apple-system, Roboto, sans-serif; font-style: normal; color: #94a3b8; }
  .tb { margin: 10px 0; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
  .tb.user { margin-left: 16%; background: rgba(34,211,238,.14); border: 1px solid rgba(34,211,238,.3); color: #e2e8f0; font: 16px/1.5 -apple-system, Roboto, sans-serif; font-style: normal; white-space: pre-wrap; }
  .tb.bot { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: rgba(255,255,255,.9); font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: 20px; line-height: 32px; }
  .tb.bot.think { color: #94a3b8; font: 15px/1.5 -apple-system, Roboto, sans-serif; font-style: normal; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .chip { border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.08); color: #a5f3fc; font: 600 13px/1.3 -apple-system, Roboto, sans-serif; font-style: normal; padding: 8px 12px; border-radius: 999px; text-align: left; }
  .tform { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  #tinput { flex: 1; min-width: 0; resize: none; max-height: 140px; box-sizing: border-box; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; color: #e2e8f0; padding: 10px 14px; font: 16px/1.4 -apple-system, Roboto, sans-serif; font-style: normal; outline: none; }
  #tinput:focus { border-color: rgba(34,211,238,.5); }
  #tsend { flex: none; padding: 12px 18px; }
</style>
</head>
<body>
<div id="root"><div id="note"></div><div id="tutorwrap"></div></div>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/* Short-notes page (plan step N6). The renderer lives in richtext.js (shared with flashcards).
 * Called from the app: window.setNote(text, startFrac).
 * The AI tutor opens automatically in a full-width panel after the note. No launch button or separate Summary action.
 * The page keeps the conversation (tutorMsgs) and asks the app
 * through WTBridge.onTutorAsk({ id, messages: [{ role, content }...] }); the app sends it to the tutor route with the chapter
 * as context and streams the answer back with window.wtTutorSet(id, fullTextSoFar, state) (state: stream, done, failed) and
 * window.wtTutorSuggest(id, jsonArray). WTBridge.onTutorStop() cancels a running answer. The box has no scroll of its own,
 * it grows with the chat and the whole page scrolls. The chat is kept only while the note is open.
 * Reading progress (plan step N10, as the website's NotesViewer): the scrolled share of the page is reported
 * through WTBridge.onProgress({ pct }) (0 to 100, at most about every 2 seconds, 100 at once from 95 percent on
 * and after a successful Summary); the app saves it to learning_progress.
 * N1 (docs/READER_EXAM_FLASHCARD_FIX_PLAN.md): the note remembers where the student stopped, like the PDF reader.
 * The app passes the saved position as startFrac (0 to 1, share of the scrollable height; a share, not pixels, so it
 * still fits when the text size or the screen width is different). When the page is laid out (fonts ready) it scrolls
 * there, once more after 400 ms if the student has not touched the screen yet (maths and fonts can still change the
 * height), and then reports every position through WTBridge.onPosition({ frac }) (trailing, every 300 ms at most).
 * Nothing is reported before the restore, so the first screen (top) never overwrites the saved position. No saved
 * position (0), a position at the very start or a note that was read to the end (98 percent or more) opens at the top. */
var noteText = "", seq = 0;
var lastPct = -1, pendingPct = -1, progTimer = 0, sent100 = false;
var posTimer = 0, canSavePos = false, userTouched = false;
/* inline AI tutor state */
var tutorBusy = false, tutorBuilt = false, tutorReqId = "", tutorMsgs = [], tutorNodes = [];
var TUTOR_BUSY = "The Wisdom Tower AI Tutor is currently experiencing high demand. Please wait a moment and try asking your question again.";
var TUTOR_STOPPED = "Response stopped. What would you like to explore instead?";
var TUTOR_STARTERS = ["Explain this chapter in simple terms", "What are the key ideas in this chapter?", "Give me worked examples"];
var TUTOR_CONTINUE = "Continue teaching me from where we left off";
var TUTOR_RETRY = ["Try asking again", "Explain in simpler terms", "Give me an example"];

/* the AI writes math as \( ... \) and \[ ... \]; the shared renderer reads $ ... $ and $$ ... $$ */
function aiText(s) {
  return String(s == null ? "" : s)
    .replace(/\\\[([\s\S]+?)\\\]/g, function (m, a) { return "$$" + a + "$$"; })
    .replace(/\\\(([\s\S]+?)\\\)/g, function (m, a) { return "$" + a + "$"; });
}

function sendProgress(pct) {
  if (!(window.WTBridge && window.WTBridge.onProgress)) return;
  if (pct === lastPct) return;
  lastPct = pct;
  try { window.WTBridge.onProgress(JSON.stringify({ pct: pct })); } catch (e) { /* ignore */ }
}

function flushProgress() {
  progTimer = 0;
  if (pendingPct >= 0) sendProgress(pendingPct);
}

function reportScroll() {
  if (!noteText) return;
  var h = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  var y = window.scrollY || document.documentElement.scrollTop || 0;
  var pct = Math.min(100, Math.round((y / h) * 100));
  pendingPct = pct;
  if (pct >= 95 && !sent100) {
    sent100 = true;
    pendingPct = 100;
    sendProgress(100);
    return;
  }
  if (!progTimer) progTimer = window.setTimeout(flushProgress, 2000);
}

/* N1: report the reading position (a share of the scrollable height) so the app can keep it on the phone */
function sendPos() {
  posTimer = 0;
  if (!canSavePos || !noteText) return;
  var h = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  var y = window.scrollY || document.documentElement.scrollTop || 0;
  var frac = Math.max(0, Math.min(1, y / h));
  if (window.WTBridge && window.WTBridge.onPosition) {
    try { window.WTBridge.onPosition(JSON.stringify({ frac: frac })); } catch (e) { /* ignore */ }
  }
}

function schedulePos() {
  if (!canSavePos || posTimer) return;
  posTimer = window.setTimeout(sendPos, 300);
}

window.addEventListener("scroll", reportScroll, { passive: true });
window.addEventListener("scroll", schedulePos, { passive: true });
window.addEventListener("resize", reportScroll, { passive: true });
window.addEventListener("touchstart", function () { userTouched = true; }, { passive: true });

/* ---- Full-width AI tutor, automatically open at the end of every note ---- */

function tutorPaint(i) {
  var m = tutorMsgs[i], el = tutorNodes[i];
  if (!m || !el) return;
  if (m.role === "user") {
    el.className = "tb user";
    el.textContent = m.content;
    return;
  }
  if (!m.content) {
    el.className = "tb bot think";
    el.textContent = "Thinking\u2026";
    return;
  }
  el.className = "tb bot";
  try { el.innerHTML = window.WTRich.render(aiText(m.content)); } catch (e) { el.textContent = m.content; }
}

/* adds a bubble for every message that has none yet (finished bubbles are never redrawn) */
function tutorDraw() {
  var box = document.getElementById("tmsgs");
  if (!box) return;
  for (var i = 0; i < tutorMsgs.length; i++) {
    if (!tutorNodes[i]) {
      var d = document.createElement("div");
      box.appendChild(d);
      tutorNodes[i] = d;
      tutorPaint(i);
    }
  }

}

/* starter prompts before the first question, follow-up prompts after an answer */
function tutorChips() {
  var c = document.getElementById("tchips");
  if (!c) return;
  c.innerHTML = "";
  if (tutorBusy) return;
  var items = [];
  var last = tutorMsgs[tutorMsgs.length - 1];
  if (!last) items = TUTOR_STARTERS.slice();
  else if (last.role === "assistant" && last.suggestions) items = last.suggestions.slice(0, 3);
  items.push(TUTOR_CONTINUE);
  for (var i = 0; i < items.length; i++) {
    var b = document.createElement("button");
    b.className = "chip" + (items[i] === TUTOR_CONTINUE ? " continue" : "");
    b.textContent = items[i] === TUTOR_CONTINUE ? "Continue learning with me →" : items[i];
    b.setAttribute("data-q", items[i]);
    c.appendChild(b);
  }
}

function tutorBtn() {
  var b = document.getElementById("tsend");
  if (b) b.textContent = tutorBusy ? "Stop" : "Send";
}

function buildTutor() {
  if (tutorBuilt) return;
  tutorBuilt = true;
  var w = document.getElementById("tutorwrap");
  w.innerHTML = '<section class="tutorbox">' +
    '<div class="tutorhead"><div class="tutorbrand">WISDOM TOWER · AI TUTOR</div><button class="clearbtn" id="tclear">Clear chat</button></div>' +
    '<div class="welcome">Welcome! Let’s understand this chapter together.<small>I can explain difficult ideas, highlight what matters, solve worked examples and keep teaching you as long as you need.</small></div>' +
    '<div id="tmsgs"></div><div class="chips" id="tchips"></div>' +
    '<div class="clearconfirm" id="tclearconfirm">Clear this conversation and start fresh?<br><button id="tclearconfirmyes">Clear chat</button><button id="tclearconfirmno">Keep chatting</button></div>' +
    '<div class="tform"><textarea id="tinput" rows="1" placeholder="Ask anything about this chapter…"></textarea>' +
    '<button class="sumbtn tutorbtn" id="tsend">Send</button></div></section>';
  var input = document.getElementById("tinput");
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(140, input.scrollHeight) + "px";
  });
  input.addEventListener("focus", function () {
    window.setTimeout(function () { try { input.scrollIntoView({ block: "center" }); } catch (e) {} }, 350);
  });
  tutorDraw();
  tutorChips();
  tutorBtn();
}

function tutorSend(text) {
  text = String(text == null ? "" : text).trim();
  if (!text || tutorBusy) return;
  var input = document.getElementById("tinput");
  tutorMsgs.push({ role: "user", content: text });
  tutorMsgs.push({ role: "assistant", content: "", suggestions: [] });
  var history = [];
  for (var i = 0; i < tutorMsgs.length - 1; i++) {
    if (tutorMsgs[i].content) history.push({ role: tutorMsgs[i].role, content: tutorMsgs[i].content });
  }
  tutorBusy = true;
  tutorReqId = "t" + (++seq);
  if (input) { input.value = ""; input.style.height = "auto"; }
  tutorDraw();
  tutorChips();
  tutorBtn();
  /* the question goes to the top of the screen, so the answer grows below it and the student reads on from there */
  var userNode = tutorNodes[tutorMsgs.length - 2];
  if (userNode && userNode.scrollIntoView) { try { userNode.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { /* ignore */ } }
  if (!(window.WTBridge && window.WTBridge.onTutorAsk)) {
    window.wtTutorSet(tutorReqId, TUTOR_BUSY, "failed");
    return;
  }
  try {
    window.WTBridge.onTutorAsk(JSON.stringify({ id: tutorReqId, messages: history }));
  } catch (e) {
    window.wtTutorSet(tutorReqId, TUTOR_BUSY, "failed");
  }
}

function tutorStop() {
  if (!tutorBusy) return;
  var i = tutorMsgs.length - 1, m = tutorMsgs[i];
  tutorBusy = false;
  tutorReqId = ""; /* anything the app still sends for this question is ignored */
  if (window.WTBridge && window.WTBridge.onTutorStop) {
    try { window.WTBridge.onTutorStop(); } catch (e) { /* ignore */ }
  }
  if (m && m.role === "assistant") {
    if (!m.content) m.content = TUTOR_STOPPED;
    tutorPaint(i);
  }
  tutorChips();
  tutorBtn();
}

/* the app streams the answer: the full text so far each time, state = stream | done | failed */
window.wtTutorSet = function (id, text, state) {
  if (id !== tutorReqId) return;
  var i = tutorMsgs.length - 1, m = tutorMsgs[i];
  if (!m || m.role !== "assistant") return;
  m.content = String(text == null ? "" : text);
  tutorPaint(i);
  if (state !== "stream") {
    tutorBusy = false;
    if (state === "failed" && !m.suggestions.length) m.suggestions = TUTOR_RETRY.slice();
    tutorChips();
    tutorBtn();
  }
};

/* follow-up prompts that come at the end of an answer */
window.wtTutorSuggest = function (id, json) {
  if (id !== tutorReqId) return;
  var m = tutorMsgs[tutorMsgs.length - 1];
  if (!m || m.role !== "assistant") return;
  try {
    var a = JSON.parse(json);
    if (a && a.length) m.suggestions = a.slice(0, 3).map(String);
  } catch (e) { /* ignore */ }
  tutorChips();
};

window.setNote = function (text, startFrac) {
  var note = document.getElementById("note");
  var root = document.getElementById("root");
  var startF = Number(startFrac);
  var restore = isFinite(startF) && startF > 0.01 && startF < 0.98;
  if (root) root.classList.remove("ready");
  noteText = String(text == null ? "" : text);

  lastPct = -1; pendingPct = -1; sent100 = false;
  canSavePos = false; userTouched = false;
  /* a new note starts with a closed, empty tutor */
  tutorBusy = false; tutorBuilt = false; tutorReqId = ""; tutorMsgs = []; tutorNodes = [];
  var tw = document.getElementById("tutorwrap");
  if (tw) { tw.innerHTML = ""; tw.style.display = "block"; }
  if (progTimer) { window.clearTimeout(progTimer); progTimer = 0; }
  if (posTimer) { window.clearTimeout(posTimer); posTimer = 0; }
  try {
    note.innerHTML = window.WTRich.render(text);
  } catch (e) {
    note.innerHTML = '<p class="msg">Could not display this note.</p>';
  }
  buildTutor();
  window.scrollTo(0, 0);

  function applyPos() {
    var h = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if (h > 0) window.scrollTo(0, Math.round(startF * h));
  }

  function notifyReady() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        try { if (restore) applyPos(); } catch (e) { /* a bad position must never break the note */ }
        if (root) root.classList.add("ready");
        if (window.WTBridge && window.WTBridge.onReady) {
          try { window.WTBridge.onReady(); } catch (e) { /* ignore */ }
        }
        canSavePos = true;
        if (restore) {
          window.setTimeout(function () {
            if (!userTouched) { try { applyPos(); } catch (e) { /* ignore */ } }
          }, 400);
        }
      });
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(notifyReady).catch(notifyReady);
  } else {
    notifyReady();
  }
};

document.getElementById("tutorwrap").addEventListener("click", function (e) {
  var t = e.target;
  if (!t) return;
  if (t.id === "tclear") {
    var cf = document.getElementById("tclearconfirm"); if (cf) cf.style.display = "block";
    return;
  }
  if (t.id === "tclearconfirmno") {
    var cf = document.getElementById("tclearconfirm"); if (cf) cf.style.display = "none";
    return;
  }
  if (t.id === "tclearconfirmyes") {
    if (tutorBusy && window.WTBridge && window.WTBridge.onTutorStop) { try { window.WTBridge.onTutorStop(); } catch (e) {} }
    tutorBusy = false; tutorReqId = ""; tutorMsgs = []; tutorNodes = [];
    var box = document.getElementById("tmsgs"); if (box) box.innerHTML = "";
    var cf = document.getElementById("tclearconfirm"); if (cf) cf.style.display = "none";
    tutorDraw(); tutorChips(); tutorBtn();
    return;
  }
  if (t.id === "tsend") {
    if (tutorBusy) tutorStop();
    else tutorSend((document.getElementById("tinput") || {}).value);
    return;
  }
  var q = t.getAttribute && t.getAttribute("data-q");
  if (q) tutorSend(q);
});

</script>
</body>
</html>
